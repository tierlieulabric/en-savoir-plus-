<!DOCTYPE html>
<html>

<head>
    <title>Mes Compteurs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial; text-align: center; margin-top: 30px; background-color: #f4f4f9;">

    <!-- 1. L'affichage des compteurs sur votre site -->
    <div style="font-family: Arial; text-align: center; max-width: 400px; margin: auto;">
        <h3>Tableau de Bord</h3>

        <!-- COMPTEUR 1 -->
        <div style="margin: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <h4>Vos Abonnés</h4> 
            <h2><span id="site_val_c1">0</span></h2>
            <button onclick="modifierSite('c1', 1)">+1</button>
            <button onclick="modifierSite('c1', -1)">-1</button>
        </div>

        <!-- COMPTEUR 2 -->
        <div style="margin: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <h4>Vos Ventes</h4>
            <h2><span id="site_val_c2">0</span></h2>
            <button onclick="modifierSite('c2', 1)">+1</button>
            <button onclick="modifierSite('c2', -1)">-1</button>
        </div>

        <!-- COMPTEUR 3 -->
        <div style="margin: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <h4>Vos Avis</h4>
            <h2><span id="site_val_c3">0</span></h2>
            <button onclick="modifierSite('c3', 1)">+1</button>
            <button onclick="modifierSite('c3', -1)">-1</button>
        </div>
    </div>

    <!-- 2. Le script de communication ultra-sécurisé -->
    <script>
        const API_URL = "https://onrender.com";

        // Boîte de secours locale : si Python ne répond pas, le site utilise ces chiffres
        let donneesLocales = {
            "c1": { valeur: 0 },
            "c2": { valeur: 0 },
            "c3": { valeur: 0 }
        };

        // Charger les données de départ
        function chargerDonneesDuSite() {
            fetch(API_URL + "/data")
                .then(res => res.json())
                .then(data => {
                    // Si Python répond correctement, on prend ses chiffres
                    if (data) {
                        for (let id in data) {
                            if (donneesLocales[id]) donneesLocales[id].valeur = data[id].valeur || 0;
                        }
                    }
                    actualiserDesign();
                })
                .catch(err => {
                    console.log("Le serveur Python ne répond pas, utilisation du mode local.");
                    actualiserDesign();
                });
        }

        // Action de clic (+1 ou -1)
        function modifierSite(id, val) {
            // ÉTAPE ULTRA-IMPORTANTE : On fait l'addition immédiatement à l'écran !
            if (donneesLocales[id]) {
                donneesLocales[id].valeur += val;
                actualiserDesign();
            }

            // On essaie d'envoyer l'info à Python en arrière-plan
            fetch(API_URL + "/update", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, action: 'add', val: val })
            }).catch(err => console.log("Impossible de sauvegarder sur le serveur Python."));
        }

        // Mettre à jour l'affichage des chiffres
        function actualiserDesign() {
            for (let id in donneesLocales) {
                let elVal = document.getElementById('site_val_' + id);
                if (elVal) {
                    elVal.innerText = donneesLocales[id].valeur;
                }
            }
        }

        // Lancement automatique
        chargerDonneesDuSite();
    </script>
</body>

</html>

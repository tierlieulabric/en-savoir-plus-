        <script>

            // Tableau pour stocker les fonctions de mise à jour de chaque compteur
            const listeReset = [];

            function lierCompteur(checkboxId, compteurId) {
                const cb = document.getElementById(checkboxId);
                const counter = document.getElementById(compteurId);

                let valeur = parseInt(localStorage.getItem(compteurId)) || 0;
                counter.textContent = valeur;

                cb.addEventListener('click', () => {
                    valeur += 1;
                    counter.textContent = valeur;
                    localStorage.setItem(compteurId, valeur);
                });

                // On enregistre une fonction pour pouvoir remettre à zéro ce compteur plus tard
                listeReset.push(() => {
                    valeur = 0;
                    counter.textContent = 0;
                    cb.checked = false; // Décoche aussi la case par précaution
                });
            }

            // Initialisation des trois compteurs
            lierCompteur('check1', 'count1');
            lierCompteur('check2', 'count2');
            lierCompteur('check3', 'count3');

            // Gestion du clic sur le bouton de réinitialisation
            document.getElementById('btnReset').addEventListener('click', () => {
                // 1. Efface toutes les données stockées dans le localStorage
                localStorage.clear();

                // 2. Exécute la remise à zéro visuelle pour chaque compteur
                listeReset.forEach(resetFonction => resetFonction());
            });

        </script>







        <!-- Vos trois compteurs sources -->
        <input type="number" id="c1" value="0">
        <input type="number" id="c2" value="0">
        <input type="number" id="c3" value="0">

        <!-- Le compteur unique global -->
        <div>
            <label for="totalCompteur">Compteur Global :</label>
            <input type="number" id="totalCompteur" value="0" readonly>
        </div>

        <button id="btn-reset">Réinitialiser</button>

        <script>
            const inputs = [
                document.getElementById('c1'),
                document.getElementById('c2'),
                document.getElementById('c3')
            ];
            // Le sélecteur cible maintenant le quatrième input
            const totalCompteur = document.getElementById('totalCompteur');
            const resetBtn = document.getElementById('btn-reset');

            // 1. Charger les valeurs sauvegardées au démarrage
            function chargerDonnees() {
                inputs.forEach(input => {
                    const valeurSauvegardee = localStorage.getItem(`compteur_${input.id}`);
                    if (valeurSauvegardee !== null) {
                        input.value = valeurSauvegardee;
                    }
                });
                mettreAJourTotal();
            }

            // 2. Calculer le total et mettre à jour le compteur unique
            function mettreAJourTotal() {
                let somme = 0;
                inputs.forEach(input => {
                    const valeur = parseFloat(input.value) || 0;
                    somme += valeur;
                    localStorage.setItem(`compteur_${input.id}`, input.value);
                });
                // On met à jour la propriété .value du quatrième compteur
                totalCompteur.value = somme;
            }

            // 3. Fonction pour tout remettre à zéro
            function reinitialiser() {
                inputs.forEach(input => {
                    input.value = 0;
                    localStorage.removeItem(`compteur_${input.id}`);
                });
                mettreAJourTotal();
            }

            // 4. Écouteurs d'événements
            inputs.forEach(input => {
                input.addEventListener('input', mettreAJourTotal);
            });

            resetBtn.addEventListener('click', reinitialiser);

            // Charger les données dès que la page est prête
            document.addEventListener('DOMContentLoaded', chargerDonnees);

        </script>

        <script type="module">
            import { initializeApp } from "https://gstatic.com";
            import { getDatabase, ref, set, onValue } from "https://gstatic.com";

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyDESTPy5RYefs283tnt_qynpQWLFG8nX4s",
                authDomain: "projet-1-ea7e5.firebaseapp.com",
                projectId: "projet-1-ea7e5",
                storageBucket: "projet-1-ea7e5.firebasestorage.app",
                messagingSenderId: "856780196636",
                appId: "1:856780196636:web:46cb7cd9c0a95fd3d688d9"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const dbRef = ref(db, 'compteurs');

            // Sélection des éléments HTML
            const inputs = [
                document.getElementById('c1'),
                document.getElementById('c2'),
                document.getElementById('c3')
            ];
            const totalCompteur = document.getElementById('totalCompteur');
            const resetBtn = document.getElementById('btn-reset');

            // Variable de verrouillage pour éviter les boucles infinies de mise à jour
            let enTrainDeMettreAJour = false;

            // 2. ENVOYER les données au Cloud quand l'utilisateur tape un chiffre
            function sauvegarderVersFirebase() {
                if (enTrainDeMettreAJour) return;

                const donnees = {
                    c1: parseFloat(inputs[0].value) || 0,
                    c2: parseFloat(inputs[1].value) || 0,
                    c3: parseFloat(inputs[2].value) || 0
                };

                // Envoie l'objet entier sur Firebase
                set(dbRef, donnees);
            }

            // 3. RECEVOIR les données du Cloud en temps réel (sur PC et Téléphone simultanément)
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    enTrainDeMettreAJour = true;

                    // Met à jour les champs de saisie avec les valeurs du cloud
                    inputs[0].value = data.c1 || 0;
                    inputs[1].value = data.c2 || 0;
                    inputs[2].value = data.c3 || 0;

                    // Calcule et affiche le compteur global
                    totalCompteur.value = (data.c1 || 0) + (data.c2 || 0) + (data.c3 || 0);

                    enTrainDeMettreAJour = false;
                }
            });

            // 4. Bouton Réinitialiser (écrase les valeurs sur le cloud)
            resetBtn.addEventListener('click', () => {
                set(dbRef, { c1: 0, c2: 0, c3: 0 });
            });

            // Écouteurs d'événements sur les inputs
            inputs.forEach(input => {
                input.addEventListener('input', sauvegarderVersFirebase);
            });
        </script>

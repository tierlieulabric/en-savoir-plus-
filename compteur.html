    <section class="">

        <div class="layout-centre">

            <!--Case 1 -->
            <label class="justify-center">
                <input type="checkbox" id="check1"> <i class="ph ph-hand-heart"></i>
                (J'Adore : <span id="count1">0</span>)
            </label><br>

            <!-- Case 2 -->
            <label>
                <input type="checkbox" id="check2"> <i class="ph ph-heart"></i>
                (J'Aime : <span id="count2">0</span>)
            </label><br>

            <!-- Case 3 -->
            <label>
                <input type="checkbox" id="check3"> <i class="ph ph-heart-straight-break"></i>
                (J'Aime pas : <span id="count3">0</span>)
            </label><br><br>

            <button class="margin-bottom" id="btnReset">Réinitialiser tous les compteurs</button>

        </div>

        <script>

            // Tableau pour stocker les fonctions de mise à jour de chaque compteur
            const listeReset = [];

            function lierCompteur(checkboxId, compteurId) {
                const cb = document.getElementById(checkboxId);
                const counter = document.getElementById(compteurId);

                let valeur = parseInt(localStorage.getItem(compteurId)) || 0;
                counter.textContent = valeur;

                cb.addEventListener('click', () => {
                    valeur += 1;
                    counter.textContent = valeur;
                    localStorage.setItem(compteurId, valeur);
                });

                // On enregistre une fonction pour pouvoir remettre à zéro ce compteur plus tard
                listeReset.push(() => {
                    valeur = 0;
                    counter.textContent = 0;
                    cb.checked = false; // Décoche aussi la case par précaution
                });
            }

            // Initialisation des trois compteurs
            lierCompteur('check1', 'count1');
            lierCompteur('check2', 'count2');
            lierCompteur('check3', 'count3');

            // Gestion du clic sur le bouton de réinitialisation
            document.getElementById('btnReset').addEventListener('click', () => {
                // 1. Efface toutes les données stockées dans le localStorage
                localStorage.clear();

                // 2. Exécute la remise à zéro visuelle pour chaque compteur
                listeReset.forEach(resetFonction => resetFonction());
            });

        </script>













    </section>

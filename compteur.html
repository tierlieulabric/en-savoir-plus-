<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes 3 Compteurs</title>
    <link rel="stylesheet" href="style.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .compteur-bloc {
            background: #2a2a2a;
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #00ff88;
            border-right: 5px solid #00ff88;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .valeur {
            font-size: 50px;
            font-weight: bold;
            color: #00ff88;
            margin: 10px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            font-size: 24px;
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background-color: #00ff88;
            color: #121212;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        button.moins {
            background-color: #ff3b30;
            color: white;
        }

        .btn-refresh {
            width: 100%;
            margin-top: 15px;
            background-color: #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

    </style>

</head>

<body class="body">

    <div class="container">

        <h1>Compteur de la BRIC</h1>

        <!-- COMPTEUR 1 -->
        <div class="compteur-bloc">
            <h2></h2>
            <div class="valeur" id="score1">0</div>
            <div class="buttons">
                <button class="moins btn-clic" onclick="changerCompteur('compteur1', -1)">-</button>
                <button class="btn-clic" onclick="changerCompteur('compteur1', 1)">😍</button>
            </div>
        </div>

        <!-- COMPTEUR 2 -->
        <div class="compteur-bloc">
            <h2></h2>
            <div class="valeur" id="score2">0</div>
            <div class="buttons">
                <button class="moins btn-clic" onclick="changerCompteur('compteur2', -1)">-</button>
                <button class="btn-clic" onclick="changerCompteur('compteur2', 1)">🥰</button>
            </div>
        </div>

        <!-- COMPTEUR 3 -->
        <div class="compteur-bloc">
            <h2></h2>
            <div class="valeur" id="score3">0</div>
            <div class="buttons">
                <button class="moins btn-clic" onclick="changerCompteur('compteur3', -1)">-</button>
                <button class="btn-clic" onclick="changerCompteur('compteur3', 1)">😡</button>
            </div>
        </div>

        <div class="status" id="status">Connexion...</div>

    </div>

    <script>

        // ⚠️ REMPLACEZ CETTE ADRESSE PAR VOTRE LIEN UNIQUE NPOINT
        const BIN_URL = "https://api.npoint.io/5ae1c7d743734f5db6df";

        let scores = { compteur1: 0, compteur2: 0, compteur3: 0 };
        let enCours = false;

        function figerInterface(etat) {
            const boutons = document.querySelectorAll('.btn-clic');
            boutons.forEach(b => b.disabled = etat);
        }

        // Récupère les 3 scores en ligne d’un coup
        async function recupererCompteurs() {
            document.getElementById('status').innerText = "Vérification des scores...";
            try {
                const reponse = await fetch(BIN_URL);
                if (!reponse.ok) throw new Error("Erreur de lecture");

                const donnees = await reponse.json();

                // On met à jour nos variables locales
                scores.compteur1 = donnees.compteur1 || 0;
                scores.compteur2 = donnees.compteur2 || 0;
                scores.compteur3 = donnees.compteur3 || 0;

                // On affiche les scores sur l'écran
                document.getElementById('score1').innerText = scores.compteur1;
                document.getElementById('score2').innerText = scores.compteur2;
                document.getElementById('score3').innerText = scores.compteur3;

                document.getElementById('status').innerText = "À jour !";
            } catch (erreur) {
                console.error(erreur);
                document.getElementById('status').innerText = "Erreur de connexion.";
            }
        }

        // Modifie le score et l'envoie sur le serveur
        async function changerCompteur(nomCompteur, valeur) {
            if (enCours) return; // Empêche de cliquer partout pendant l'envoi
            enCours = true;
            figerInterface(true);
            document.getElementById('status').innerText = "Mise à jour en cours...";

            // 1. On modifie le score localement pour le calcul
            scores[nomCompteur] += valeur;

            // Sécurité : empêche d'aller en dessous de 0
            if (scores[nomCompteur] < 0) scores[nomCompteur] = 0;

            try {
                // 2. On envoie les nouvelles données à npoint
                const reponse = await fetch(BIN_URL, {
                    method: 'POST', // npoint accepte POST ou PUT pour mettre à jour
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(scores)
                });

                if (!reponse.ok) throw new Error("Erreur d'écriture");

                // 3. On rafraîchit l'affichage
                await recupererCompteurs();
            } catch (erreur) {
                console.error(erreur);
                document.getElementById('status').innerText = "Erreur de sauvegarde.";
                // En cas d'erreur, on remet l'ancien score
                scores[nomCompteur] -= valeur;
            } finally {
                enCours = false;
                figerInterface(false);
            }
        }

        // Charge les scores automatiquement au démarrage de la page
        window.onload = recupererCompteurs;

    </script>

</body>

</html>

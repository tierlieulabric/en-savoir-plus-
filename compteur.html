<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes 3 Compteurs</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }

        .compteur-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .compteur-box {
            border: 2px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            width: 120px;
        }

        .valeur {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Style pour vos images-boutons */
        .btn-clic {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin: 5px;
        }

        .btn-clic:hover {
            transform: scale(1.1);
        }

        .btn-clic:active {
            transform: scale(0.95);
        }

        /* Classe ajoutée par JavaScript quand l'interface est figée */
        .btn-clic.desactive {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
            /* Bloque complètement le clic */
        }

        #status {
            font-style: italic;
            color: #666;
            margin-top: 15px;
        }

        .btn-refresh {
            width: 25px;
            height: 25px;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>

</head>

<body class="body">

    <div class="compteur-container">

        <!-- Compteur 1 -->

        <div class="compteur-box">
            <!-- Image +1 -->
            <img src="asset/emoji_vert_-removebg.png" alt="+1" class="btn-clic" onclick="changerCompteur('compteur1', 1)">
            <!-- Image -1 -->
            <img src="https://icons8.com" alt="-1" class="btn-clic" onclick="changerCompteur('compteur1', -1)">

        </div>

        <!-- Compteur 2 -->
        <div class="compteur-box">
            <!-- Image +1 -->
            <img src="https://icons8.com" alt="+1" class="btn-clic" onclick="changerCompteur('compteur2', 1)">
           
        </div>

        <!-- Compteur 3 -->
        <div class="compteur-box">
            <!-- Image +1 -->
            <img src="https://icons8.com" alt="+1" class="btn-clic" onclick="changerCompteur('compteur3', 1)">
           
        </div>

        <div id="status">Initialisation...</div>

    </div>

    <script>

        // ⚠️ REMPLACEZ CETTE ADRESSE PAR VOTRE LIEN UNIQUE NPOINT
        const BIN_URL = "https://api.npoint.io/5ae1c7d743734f5db6df";

        let scores = { compteur1: 0, compteur2: 0, compteur3: 0 };
        let enCours = false;

        // Version adaptée pour gérer la désactivation visuelle et technique des images
        function figerInterface(etat) {
            const boutons = document.querySelectorAll('.btn-clic');
            boutons.forEach(b => {
                if (etat) {
                    b.classList.add('desactive');
                } else {
                    b.classList.remove('desactive');
                }
            });
        }

        // Récupère les 3 scores en ligne d’un coup
        async function recupererCompteurs() {
            document.getElementById('status').innerText = "Vérification des scores...";
            try {
                const reponse = await fetch(BIN_URL);
                if (!reponse.ok) throw new Error("Erreur de lecture");

                const donnees = await reponse.json();

                // On met à jour nos variables locales
                scores.compteur1 = donnees.compteur1 || 0;
                scores.compteur2 = donnees.compteur2 || 0;
                scores.compteur3 = donnees.compteur3 || 0;

                // On affiche les scores sur l'écran
                document.getElementById('score1').innerText = scores.compteur1;
                document.getElementById('score2').innerText = scores.compteur2;
                document.getElementById('score3').innerText = scores.compteur3;

                document.getElementById('status').innerText = "À jour !";
            } catch (erreur) {
                console.error(erreur);
                document.getElementById('status').innerText = "Erreur de connexion.";
            }
        }

        // Modifie le score et l'envoie sur le serveur
        async function changerCompteur(nomCompteur, valeur) {
            if (enCours) return; // Empêche de cliquer partout pendant l'envoi
            enCours = true;
            figerInterface(true);
            document.getElementById('status').innerText = "Mise à jour en cours...";

            // 1. On modifie le score localement pour le calcul
            scores[nomCompteur] += valeur;

            // Sécurité : empêche d'aller en dessous de 0
            if (scores[nomCompteur] < 0) scores[nomCompteur] = 0;

            try {
                // 2. On envoie les nouvelles données à npoint
                const reponse = await fetch(BIN_URL, {
                    method: 'POST', // npoint accepte POST ou PUT pour mettre à jour
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(scores)
                });

                if (!reponse.ok) throw new Error("Erreur d'écriture");

                // 3. On rafraîchit l'affichage
                await recupererCompteurs();
            } catch (erreur) {
                console.error(erreur);
                document.getElementById('status').innerText = "Erreur de sauvegarde.";
                // En cas d'erreur, on remet l'ancien score
                scores[nomCompteur] -= valeur;
            } finally {
                enCours = false;
                figerInterface(false);
            }
        }

        // Charge les scores automatiquement au démarrage de la page
        window.onload = recupererCompteurs;

    </script>

</body>

</html>

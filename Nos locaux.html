            <script>

                // Sélectionne toutes les images de la galerie
                const toutesLesImages = document.querySelectorAll('.image-spirale');

                // Applique le comportement indépendant sur chaque image
                toutesLesImages.forEach((img) => {

                    // Déclenche la spirale au clic
                    img.addEventListener('click', () => {
                        img.classList.add('anime-depart');
                    });

                    // Gère la transition entre disparition et retour
                    img.addEventListener('animationend', (e) => {
                        if (e.animationName === 'spirale-disparait') {
                            setTimeout(() => {
                                img.classList.remove('anime-depart');
                                img.classList.add('anime-retour');
                            }, 1000); // Reste caché pendant 1 seconde
                        }
                        else if (e.animationName === 'spirale-revient') {
                            img.classList.remove('anime-retour'); // Supprime la classe pour pouvoir recliquer !
                        }
                    });

                });

            </script>

    <section class="flex justify-center image-spirale">

        <div class="photo-container">
            <!-- C'est ce bloc "wrapper" qui va écouter le clic et tourner -->
            <div class="photo-wrapper" id="cibleClic">

                <img src="asset/nettoyeurs-entretiens.jpg" alt="Groupe d'amis">

                <!-- Flèche 1 -->
                <div class="arrow-marker" style="top: 38%; left: 25%;">
                    <span class="tooltip">Thomas (Développeur)</span>
                </div>

                <!-- Flèche 2 -->
                <div class="arrow-marker" style="top: 33%; left: 65%;">
                    <span class="tooltip">Sarah (Designer)</span>
                </div>

            </div>
            
            <script>
                const cible = document.getElementById('cibleClic');

                cible.addEventListener('click', function () {
                    // Évite de relancer si l'animation tourne déjà
                    if (cible.classList.contains('tourner')) return;

                    // Ajoute la classe pour activer l'animation `@keyframes`
                    cible.classList.add('tourner');
                });

                // Nettoie la classe une fois que la rotation est finie
                cible.addEventListener('animationend', function () {
                    cible.classList.remove('tourner');
                });
            </script>

        </div>


    </section>

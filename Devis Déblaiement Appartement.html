    <script>

        // Crée une clé unique basée sur l'adresse de la page actuelle
        const pageKey = 'scroll_' + window.location.pathname;

        // 1. Au retour sur la page, on remet l'utilisateur à sa position exacte
        window.addEventListener('load', () => {
            const savedPosition = localStorage.getItem(pageKey);
            if (savedPosition) {
                // Le délai de 100ms permet au HTML et aux images de se charger avant de scroller
                setTimeout(() => {
                    window.scrollTo({
                        top: parseInt(savedPosition, 10),
                        behavior: 'instant' // Positionnement immédiat sans animation
                    });
                }, 100);
            }
        });

        // 2. Dès que l'utilisateur fait défiler la page, on enregistre sa position
        window.addEventListener('scroll', () => {
            localStorage.setItem(pageKey, window.scrollY);
        });

    </script>

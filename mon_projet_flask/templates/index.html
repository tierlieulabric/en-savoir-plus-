<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes Compteurs Côte à Côte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f9;
      margin: 0;
    }
    
    h2 {
      text-align: center;
    }
    
    .instruction {
      text-align: center;
      color: #555;
    }

    /* Le conteneur magique qui aligne les compteurs côte à côte */
    .compteurs-groupe {
      display: flex;
      flex-wrap: wrap; /* Permet de revenir à la ligne sur petit écran */
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }

    /* Style pour chaque bloc de compteur individuel */
    .compteur-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column; /* Aligne le titre, les boutons et le score de haut en bas */
      align-items: center;
      gap: 15px;
      width: 200px; /* Largeur fixe pour chaque colonne */
    }

    /* Zone des boutons de calcul */
    .boutons-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Style pour la zone du titre modifiable */
    .input-nom {
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-bottom: 2px dashed #ccc;
      background: transparent;
      padding: 5px;
      width: 100%;
      text-align: center;
    }
    .input-nom:focus {
      outline: none;
      border-bottom: 2px solid #4caf50;
      background: #fafafa;
    }

    /* Style pour le chiffre du compteur */
    .input-score {
      width: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn-moins { background-color: #ff4d4d; color: white; }
    .btn-plus { background-color: #4caf50; color: white; }
    .btn-reset { background-color: #777; color: white; width: 100%; }
    
    /* Style pour la zone du Total */
    .total-card {
      background: #333;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px auto 0 auto; /* Centre la barre de total au milieu */
      font-size: 22px;
      font-weight: bold;
    }
    #total-affichage {
      background: #4caf50;
      padding: 5px 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Mon Tableau de Bord</h2>
  <p class="instruction">💡 <em>Clique sur les textes soulignés pour les renommer.</em></p>

  <!-- ZONE CONTENANT LES 3 COMPTEURS ALIGNÉS -->
  <div class="compteurs-groupe">
  
    <!-- COMPTEUR 1 -->
    <div class="compteur-card">
      <input type="text" class="input-nom" id="nom-1" value="Compteur A" oninput="sauvegarderNom(1)">
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(1, -1)">-</button>
        <input type="number" class="input-score" id="input-1" value="0" readonly>
        <button class="btn-plus" onclick="modifier(1, 1)">+</button>
      </div>
      <button class="btn-reset" onclick="reset(1)">RAZ</button>
    </div>

    <!-- COMPTEUR 2 -->
    <div class="compteur-card">
      <input type="text" class="input-nom" id="nom-2" value="Compteur B" oninput="sauvegarderNom(2)">
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(2, -1)">-</button>
        <input type="number" class="input-score" id="input-2" value="0" readonly>
        <button class="btn-plus" onclick="modifier(2, 1)">+</button>
      </div>
      <button class="btn-reset" onclick="reset(2)">RAZ</button>
    </div>

    <!-- COMPTEUR 3 -->
    <div class="compteur-card">
      <input type="text" class="input-nom" id="nom-3" value="Compteur C" oninput="sauvegarderNom(3)">
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(3, -1)">-</button>
        <input type="number" class="input-score" id="input-3" value="0" readonly>
        <button class="btn-plus" onclick="modifier(3, 1)">+</button>
      </div>
      <button class="btn-reset" onclick="reset(3)">RAZ</button>
    </div>

  </div>

  <!-- ZONE DU TOTAL GENERAL -->
  <div class="total-card">
    <span>TOTAL GÉNÉRAL :</span>
    <span id="total-affichage">0</span>
  </div>

  <script>
    window.onload = function() {
      for (let i = 1; i <= 3; i++) {
        const scoreSauvegarde = localStorage.getItem('compteur-' + i);
        if (scoreSauvegarde !== null) {
          document.getElementById('input-' + i).value = scoreSauvegarde;
        }
        
        const nomSauvegarde = localStorage.getItem('nom-compteur-' + i);
        if (nomSauvegarde !== null) {
          document.getElementById('nom-' + i).value = nomSauvegarde;
        }
      }
      calculerTotal();
    };

    function calculerTotal() {
      let score1 = parseInt(document.getElementById('input-1').value);
      let score2 = parseInt(document.getElementById('input-2').value);
      let score3 = parseInt(document.getElementById('input-3').value);
      let somme = score1 + score2 + score3;
      document.getElementById('total-affichage').textContent = somme;
    }

    function sauvegarderNom(numero) {
      const nouveauNom = document.getElementById('nom-' + numero).value;
      localStorage.setItem('nom-compteur-' + numero, nouveauNom);
    }

    function modifier(numero, changement) {
      const champ = document.getElementById('input-' + numero);
      let valeurActuelle = parseInt(champ.value);
      let nouvelleValeur = valeurActuelle + changement;
      
      if (nouvelleValeur < 0) { nouvelleValeur = 0; }
      
      champ.value = nouvelleValeur;
      localStorage.setItem('compteur-' + numero, nouvelleValeur);
      calculerTotal();
    }

    function reset(numero) {
      const champ = document.getElementById('input-' + numero);
      champ.value = 0;
      localStorage.setItem('compteur-' + numero, 0);
      calculerTotal();
    }
  </script>

</body>
</html>

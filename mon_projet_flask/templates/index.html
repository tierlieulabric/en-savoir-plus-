<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compteur Partagé</title>
    <!-- Outil pour le temps réel -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f7f6;
            margin: 0;
            padding-top: 100px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 { color: #333; }
        #chiffre { 
            font-size: 90px; 
            font-weight: bold; 
            color: #007BFF; 
            margin: 20px 0; 
        }
        button { 
            font-size: 22px; 
            padding: 15px 40px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Compteur de mon site</h1>
        <!-- Flask va remplacer {{ initial_val }} par le vrai chiffre -->
        <div id="chiffre">{{ initial_val }}</div>
        <button onclick="clicBouton()">Ajouter +1</button>
    </div>

    <script>
        // Connexion dynamique automatique (détecte l'IP de l'ordi ou du téléphone)
        var socket = io(window.location.origin);

        // Réception du nouveau chiffre en direct
        socket.on('mise_a_jour', function(data) {
            document.getElementById('chiffre').innerText = data.valeur;
        });

        // Envoi du clic au serveur
        function clicBouton() {
            socket.emit('clic_bouton');
        }
    </script>
</body>
</html>

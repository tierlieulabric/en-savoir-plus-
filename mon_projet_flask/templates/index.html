<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Compteurs</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }

        .conteneur {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        @media(min-width: 600px) {
            .conteneur {
                flex-direction: row;
                justify-content: center;
            }
        }

        .carte {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 180px;
        }

        .titre-fixe {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .chiffre {
            font-size: 3.5rem;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
        }

        /* 🆕 Organisation des boutons côte à côte */
        .groupe-boutons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-plus {
            background-color: #007bff;
            color: white;
            flex: 2;
        }

        .btn-plus:active {
            background-color: #0056b3;
        }

        /* 🆕 Style du nouveau bouton moins */
        .btn-moins {
            background-color: #ffc107;
            color: #212529;
            flex: 1;
        }

        .btn-moins:active {
            background-color: #d39e00;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: auto;
        }

        .btn-reset:active {
            background-color: #bd2130;
        }

        .flex {
            display: flex;
            flex-wrap: wrap;
        }
    </style>

</head>

<body>

    <p> Vous pouvez voter pour une option :</p>

    <div class="compteur-container">
  <!-- Bouton pour diminuer -->
  <button id="btnMoins">-</button>
  
  <!-- Zone de saisie qui affiche le score -->
  <input type="number" id="champCompteur" value="0" readonly>
  
  <!-- Bouton pour augmenter -->
  <button id="btnPlus">+</button>
  
  <!-- Nouveau bouton pour remettre à zéro -->
  <button id="btnReset">Remettre à zéro</button>
</div>

<script>
  // 1. On récupère tous les éléments de la page
  const champ = document.getElementById('champCompteur');
  const btnMoins = document.getElementById('btnMoins');
  const btnPlus = document.getElementById('btnPlus');
  const btnReset = document.getElementById('btnReset');

  // 2. Action quand on clique sur Plus
  btnPlus.addEventListener('click', function() {
    let valeurActuelle = parseInt(champ.value);
    champ.value = valeurActuelle + 1;
  });

  // 3. Action quand on clique sur Moins
  btnMoins.addEventListener('click', function() {
    let valeurActuelle = parseInt(champ.value);
    // On vérifie si le nombre est plus grand que 0 avant d'enlever 1
    if (valeurActuelle > 0) {
      champ.value = valeurActuelle - 1;
    }
  });

  // 4. Action quand on clique sur Remettre à zéro
  btnReset.addEventListener('click', function() {
    champ.value = 0; // On force la valeur à redevenir 0
  });
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes Compteurs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f9;
      margin: 0;
    }
    
    h2, .instruction {
      text-align: center;
    }
    .instruction { color: #555; }

    /* Grille pour mettre les compteurs côte à côte */
    .compteurs-groupe {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }

    /* Carte de chaque compteur */
    .compteur-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 220px;
    }

    /* Zone du titre avec son bouton d'édition */
    .zone-titre {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
    }

    .titre-texte {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* Petit bouton discret pour le crayon */
    .btn-edit {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 2px;
    }

    /* Zone des boutons de calcul */
    .boutons-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-score {
      width: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn-moins { background-color: #ff4d4d; color: white; }
    .btn-plus { background-color: #4caf50; color: white; }
    .btn-reset { background-color: #777; color: white; width: 100%; }
    
    /* Barre du Total */
    .total-card {
      background: #333;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px auto 0 auto;
      font-size: 22px;
      font-weight: bold;
    }
    #total-affichage {
      background: #4caf50;
      padding: 5px 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <p class="instruction"><em>cliquer sur les boutons verts pour voter</em></p>

  <div class="compteurs-groupe">
  
    <!-- COMPTEUR 1 -->
    <div class="compteur-card">
      <div class="zone-titre">
        <p class="titre-texte" id="nom-1">🥰</p>
        <button class="btn-edit" onclick="changerNom(1)"></button>
      </div>
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(1, -1)">-</button>
        <input type="number" class="input-score" id="input-1" value="0" readonly>
        <button class="btn-plus" onclick="modifier(1, 1)">+</button>
      </div>
    </div>

    <!-- COMPTEUR 2 -->
    <div class="compteur-card">
      <div class="zone-titre">
        <p class="titre-texte" id="nom-2">❤️</p>
        <button class="btn-edit" onclick="changerNom(2)"></button>
      </div>
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(2, -1)">-</button>
        <input type="number" class="input-score" id="input-2" value="0" readonly>
        <button class="btn-plus" onclick="modifier(2, 1)">+</button>
      </div>
    </div>

    <!-- COMPTEUR 3 -->
    <div class="compteur-card">
      <div class="zone-titre">
        <p class="titre-texte" id="nom-3">😡</p>
        <button class="btn-edit" onclick="changerNom(3)"></button>
      </div>
      <div class="boutons-actions">
        <button class="btn-moins" onclick="modifier(3, -1)">-</button>
        <input type="number" class="input-score" id="input-3" value="0" readonly>
        <button class="btn-plus" onclick="modifier(3, 1)">+</button>
      </div>
    </div>

  </div>

  <div class="total-card">
    <span>TOTAL GÉNÉRAL :</span>
    <span id="total-affichage">0</span>
  </div>

  <script>
    window.onload = function() {
      for (let i = 1; i <= 3; i++) {
        const scoreSauvegarde = localStorage.getItem('compteur-' + i);
        if (scoreSauvegarde !== null) {
          document.getElementById('input-' + i).value = scoreSauvegarde;
        }
        
        const nomSauvegarde = localStorage.getItem('nom-compteur-' + i);
        if (nomSauvegarde !== null) {
          document.getElementById('nom-' + i).textContent = nomSauvegarde;
        }
      }
      calculerTotal();
    };

    function calculerTotal() {
      let score1 = parseInt(document.getElementById('input-1').value);
      let score2 = parseInt(document.getElementById('input-2').value);
      let score3 = parseInt(document.getElementById('input-3').value);
      let somme = score1 + score2 + score3;
      document.getElementById('total-affichage').textContent = somme;
    }

    function modifier(numero, changement) {
      const champ = document.getElementById('input-' + numero);
      let valeurActuelle = parseInt(champ.value);
      let nouvelleValeur = valeurActuelle + changement;
      
      if (nouvelleValeur < 0) { nouvelleValeur = 0; }
      
      champ.value = nouvelleValeur;
      localStorage.setItem('compteur-' + numero, nouvelleValeur);
      calculerTotal();
    }

    function reset(numero) {
      const champ = document.getElementById('input-' + numero);
      champ.value = 0;
      localStorage.setItem('compteur-' + numero, 0);
      calculerTotal();
    }
  </script>

</body>
</html>

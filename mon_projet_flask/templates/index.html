<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteurs de la bric</title>
    <!-- Chargement propre de Socket.io -->
    <script src="https://socket.io"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }

        .conteneur {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        @media(min-width: 600px) {
            .conteneur {
                flex-direction: row;
                justify-content: center;
            }
        }

        .carte {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 180px;
        }

        .champ-nom {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            border: none;
            background: transparent;
            text-align: center;
            width: 100%;
            border-bottom: 2px dashed #ccc;
            padding: 5px 0;
        }

        .champ-nom:focus {
            border-bottom: 2px solid #007bff;
            outline: none;
            background: #f0f7ff;
        }

        .chiffre {
            font-size: 3.5rem;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
        }

        button {
            border: none;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-plus {
            background-color: #007bff;
            color: white;
        }

        .btn-plus:active {
            background-color: #0056b3;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: auto;
        }

        .btn-reset:active {
            background-color: #bd2130;
        }
    </style>
</head>

<body>
    
    <p>Cliquez sur + 1 pour voter.</p>

    <div class="conteneur">
        <!-- Compteur 1 -->
        <div class="carte">
            <input type="text" class="champ-nom" id="nom-compteur1" value="{{J'adore}}"
                onchange="changerNom('compteur1')">
            <div class="chiffre" id="valeur-compteur1">0</div>
            <button class="btn-plus" onclick="clicPlus('0')">+ 1</button>
        </div>

        <!-- Compteur 2 -->
        <div class="carte">
            <input type="text" class="champ-nom" id="nom-compteur2" value="{{ J'aime}}"
                onchange="changerNom('compteur2')">
            <div class="chiffre" id="valeur-compteur2">0</div>
            <button class="btn-plus" onclick="clicPlus('0')">+ 1</button>
        </div>

        <!-- Compteur 3 -->
        <div class="carte">
            <input type="text" class="champ-nom" id="nom-compteur3" value="{{J'aime pas}}"
                onchange="changerNom('compteur3')">
            <div class="chiffre" id="valeur-compteur3">0</div>
            <button class="btn-plus" onclick="clicPlus('0')">+ 1</button>
        </div>
    </div>

    <button class="btn-reset" onclick="clicReset()">🔄 Remettre à zéro</button>

    <script>
        // 🆕 CORRECTION CRITIQUE ICI : On force une connexion multiniveau (polling d'abord)
        // Cela évite que les navigateurs mobiles ne bloquent le clic.
        const socket = io({
            transports: ['polling', 'websocket'],
            upgrade: true
        });

        socket.on('mise_a_jour', function (donnees) {
            document.getElementById('valeur-compteur1').innerText = donnees.compteur1.valeur;
            document.getElementById('valeur-compteur2').innerText = donnees.compteur2.valeur;
            document.getElementById('valeur-compteur3').innerText = donnees.compteur3.valeur;

            if (document.activeElement !== document.getElementById('nom-compteur1')) {
                document.getElementById('nom-compteur1').value = donnees.compteur1.nom;
            }
            if (document.activeElement !== document.getElementById('nom-compteur2')) {
                document.getElementById('nom-compteur2').value = donnees.compteur2.nom;
            }
            if (document.activeElement !== document.getElementById('nom-compteur3')) {
                document.getElementById('nom-compteur3').value = donnees.compteur3.nom;
            }
        });

        function changerNom(idCompteur) {
            const nouveauNom = document.getElementById('nom-' + idCompteur).value;
            socket.emit('changer_nom', { id: idCompteur, nom: nouveauNom });
        }

        function clicPlus(idCompteur) {
            socket.emit('incrementer', idCompteur);
        }

        function clicReset() {
            if (confirm("Tout effacer ?")) {
                socket.emit('remettre_a_zero');
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communiquer avec QR Code</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="project.html">
    <link rel="stylesheet" href="script.js">
    <link rel="stylesheet" href="app.py">
    <link rel="stylesheet" href="compteur.html">
    <link rel="stylesheet" href="page.html">
    <link rel="stylesheet" href="QR Code.html">
    <link rel="stylesheet" href="server.py">

</head>

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.js">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
        integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
        </script>

</head>

<body>

    <div class="qr-card">

        <button id="btn">Générer le QR Code</button>

        <a id="qrcode-container" href="#" target="_blank"></a>

        <div id="qr-text" class="qr-text">👆 Cliquez sur le QRcode pour ouvrir le lien</div>

    </div>

    <script>
        document.getElementById('btn').addEventListener('click', createQRCode);

        function createQRCode() {
            // Le site internet vers lequel le QR code doit renvoyer
            const monLien = "https://tierlieulabric.github.io/en-savoir-plus-/";

            const QRContainer = document.getElementById("qrcode-container");
            QRContainer.innerHTML = ""; // Vide la boîte

            // 1. On donne la bonne adresse de destination au lien HTML
            QRContainer.href = monLien;

            // 2. On génère visuellement le QR code
            new QRCode(QRContainer, monLien);

            // 3. On affiche le petit texte explicatif en dessous
            document.getElementById("qr-text").style.display = "block";
        }
    </script>

</body>

</html>
